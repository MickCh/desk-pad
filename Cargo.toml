[package]
name = "desk-pad"
description = "Use a USB gamepad as keyboard and mouse on the Windows desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/MickCh/desk-pad"
publish = false

[dependencies]
# Gamepad input, shared with reaper-pad (a crate in its repository).
pad-core = { git = "https://github.com/MickCh/reaper-pad", tag = "pad-core-v0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
